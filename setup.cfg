[metadata]
name = otbio_lsl_sender
version = 0.3.0
license = MIT
license_files = LICENSE
description = Stream OT Bioelettronica Quattrocento data to Lab Streaming Layer with TTL markers
long_description = file: README.md
long_description_content_type = text/markdown
author = ausbollinger, David Pruitt
maintainer = ausbollinger
url = https://github.com/ausbollinger13/otbio-lsl-sender
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Operating System :: Microsoft :: Windows

[options]
packages = find_namespace:
package_dir =
    =src
include_package_data = True
python_requires = >=3.10
install_requires =
    PySide6>=6.0.0
    numpy>=1.20.0
    pylsl>=1.16.0
    pygame>=2.0.0

[options.packages.find]
where=src
